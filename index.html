<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>The Squeaky Spoke</title>
    <style>
      :root {
        --bg: #f7f6f2;
        --surface: #ffffff;
        --text: #1d1d1b;
        --muted: #5f5f5a;
        --accent: #d9480f;
        --border: #e3e1da;
        --warn: #b45309;
        color-scheme: light dark;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #141413;
          --surface: #1e1e1c;
          --text: #ecebe6;
          --muted: #a3a29c;
          --accent: #ff7a3d;
          --border: #33332f;
          --warn: #f59e0b;
        }
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
      }
      #login {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
        box-sizing: border-box;
      }
      #login[hidden] {
        display: none;
      }
      #login form {
        width: 100%;
        max-width: 320px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      #login h1 {
        margin: 0 0 4px;
        font-size: 22px;
      }
      #login label {
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 14px;
      }
      #login label.row {
        flex-direction: row;
        align-items: center;
        gap: 8px;
        color: var(--muted);
      }
      #login input[type='text'],
      #login input[type='password'] {
        background: var(--bg);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 8px;
        font: inherit;
      }
      #login button {
        background: var(--accent);
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 10px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      #login button:disabled {
        opacity: 0.6;
      }
      #login .msg {
        min-height: 1.2em;
        font-size: 13px;
        color: var(--warn);
      }
      #login .muted {
        font-size: 12px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div id="login" hidden>
      <form autocomplete="on">
        <h1>The Squeaky Spoke</h1>
        <label>User name <input type="text" name="username" autocomplete="username" required autofocus /></label>
        <label>Password <input type="password" name="password" autocomplete="current-password" required /></label>
        <label class="row"><input type="checkbox" name="remember" /> Keep me signed in on this computer</label>
        <button type="submit">Sign in</button>
        <div class="msg" role="status"></div>
        <div class="muted">In development: invited riders only. Your rides stay on your own computer.</div>
      </form>
    </div>
    <div id="root"></div>
    <script type="module">
      // Filled in by scripts/deploy.mjs: one wrapped copy of the app key per user, and the
      // encrypted app files. Nothing here reveals a password or the app's code.
      const CONFIG = {"build":"8571d4cd5b11e8f0","iterations":600000,"script":{"path":"/squeakyspoke/assets/app-8571d4cd5b11e8f0.js.enc","iv":"t9OkJdUw6ZDRWrlC"},"style":{"path":"/squeakyspoke/assets/app-8571d4cd5b11e8f0.css.enc","iv":"ehrCn3Lsgyuw6tc+"},"users":[{"id":"165f929a7e26528b541f6427be9c0feb5b6dda785cca55ac829e0bd2bb24cdbf","salt":"Jjg/AdZP1BELEKm7p6Wpag==","iv":"KIowFcWWmENZnqVi","wrapped":"5jN78c2Xa4eE/xdzJ+lLnGTpcfrvQDQEIESKbzLDnDjyI31kyTV1L4JHoLUYY2Iu"},{"id":"708e728bbb035e7373473c9906d05a64725d2cc6ba5bffa32cd636b94fcad040","salt":"/UQQqlkHjNERI0oxpKVg7g==","iv":"lgwjO9gSC5tCm4Zp","wrapped":"93MsjF1B3DwwqaVUI6hPo/zPxXVFRIvoQuJOkdw2DZtOqyhC/tbEgTc5DZeQEn4l"},{"id":"46f557112211f77bfda33dacf64ad70f1cf675146142c543c4ab51c0241898bb","salt":"pnRXcA+VhduR0pDQpJdw6g==","iv":"GmcoqRw4VSU9T/0c","wrapped":"ljZAwpNmdx0WdhciDxkFtWh64Oq+NnXzmTcRaNFM5JoEJReVDdaANyDGO/wYPev3"},{"id":"424bf01446198412b2b708ec901c6174b1f6a81094bacdba567bee208a6f6acf","salt":"aMFBOTCBwdEz6Al075QL5g==","iv":"SnRkZ/Radqq9bhJl","wrapped":"Wcb1nRfXAR6bTwu9FCQ6oK9I3B/sMcwKPUz3unemlbyeQ27Nau/860h/jPfSJcJb"},{"id":"51906da0d9ca619ebf4ce1e1e0fb844f87226a426c991401df222de190f071e7","salt":"2YPvEkjE443EYofTcW+A8w==","iv":"0UnN9UjupdiAXpmA","wrapped":"RHVU5rLwj82CbLf5mlOMMOgj7DOTdQKl3SHjP+Ys3VjQBNQ4U2aa/ml4DfpBcm90"},{"id":"b0b330b91cfca458a45a5b9fb3c8e019075714d45dc30efaf3f7d9a43c596fd5","salt":"1M8d00+5ACZZBHe46F1UJQ==","iv":"khSI7sJexxnAYhcq","wrapped":"P1+79nd7eeFsFNWm+F8TOX9J7iVg0YhDJAS2+ayQYO9BI2wEuS4KILgqUGboJZeF"}]};

      if (location.protocol === 'http:' && !['localhost', '127.0.0.1'].includes(location.hostname)) {
        location.replace('https://' + location.host + location.pathname + location.search);
      }

      const KEY_STORE = 'sqs:auth';
      const subtle = crypto.subtle;
      const enc = new TextEncoder();
      const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
      const toB64 = (bytes) => btoa(String.fromCharCode(...new Uint8Array(bytes)));
      const hex = (buf) => [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, '0')).join('');

      async function userId(name) {
        return hex(await subtle.digest('SHA-256', enc.encode('sqs:' + name.trim().toLowerCase())));
      }

      /** The user's password-derived key. Kept in the browser to stay signed in across publishes. */
      async function deriveUserKey(entry, password) {
        const base = await subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveBits']);
        const bits = await subtle.deriveBits(
          { name: 'PBKDF2', hash: 'SHA-256', salt: b64(entry.salt), iterations: CONFIG.iterations },
          base,
          256,
        );
        return new Uint8Array(bits);
      }

      /** Unwraps this publish's app key. Throws if the user key is wrong (AES-GCM checks it). */
      async function unwrapAppKey(entry, userKey) {
        const kek = await subtle.importKey('raw', userKey, 'AES-GCM', false, ['decrypt']);
        return new Uint8Array(await subtle.decrypt({ name: 'AES-GCM', iv: b64(entry.iv) }, kek, b64(entry.wrapped)));
      }

      async function findEntry(user) {
        const id = await userId(user);
        const entry = CONFIG.users.find((u) => u.id === id);
        if (!entry) throw new Error('unknown user');
        return entry;
      }

      async function decryptFile(key, file) {
        const res = await fetch(file.path, { cache: 'no-cache' });
        if (!res.ok) throw new Error('Could not load ' + file.path);
        return subtle.decrypt({ name: 'AES-GCM', iv: b64(file.iv) }, key, await res.arrayBuffer());
      }

      /** Decrypts and starts the app. Throws if the key is wrong (AES-GCM checks it). */
      async function start(rawKey, user) {
        const key = await subtle.importKey('raw', rawKey, 'AES-GCM', false, ['decrypt']);
        const [js, css] = await Promise.all([decryptFile(key, CONFIG.script), decryptFile(key, CONFIG.style)]);
        const style = document.createElement('style');
        style.textContent = new TextDecoder().decode(css);
        document.head.append(style);
        window.sqsUser = user;
        window.sqsSignOut = () => {
          sessionStorage.removeItem(KEY_STORE);
          localStorage.removeItem(KEY_STORE);
          location.reload();
        };
        document.getElementById('login').hidden = true;
        const url = URL.createObjectURL(new Blob([js], { type: 'text/javascript' }));
        await import(url);
      }

      function stored() {
        try {
          const s = sessionStorage.getItem(KEY_STORE) ?? localStorage.getItem(KEY_STORE);
          return s ? JSON.parse(s) : null;
        } catch {
          return null;
        }
      }

      async function boot() {
        const saved = stored();
        if (saved?.user && saved.userKey) {
          try {
            const entry = await findEntry(saved.user);
            await start(await unwrapAppKey(entry, b64(saved.userKey)), saved.user);
            return;
          } catch {
            // This user was removed, or their password changed: sign in again.
          }
        }
        sessionStorage.removeItem(KEY_STORE);
        localStorage.removeItem(KEY_STORE);
        showLogin();
      }

      function showLogin() {
        const box = document.getElementById('login');
        const form = box.querySelector('form');
        const msg = box.querySelector('.msg');
        const button = form.querySelector('button');
        box.hidden = false;
        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          const data = new FormData(form);
          const user = String(data.get('username') ?? '').trim();
          button.disabled = true;
          msg.textContent = 'Checking…';
          try {
            const entry = await findEntry(user);
            const userKey = await deriveUserKey(entry, String(data.get('password') ?? ''));
            const appKey = await unwrapAppKey(entry, userKey);
            const record = JSON.stringify({ user, userKey: toB64(userKey) });
            (data.get('remember') ? localStorage : sessionStorage).setItem(KEY_STORE, record);
            await start(appKey, user);
          } catch {
            msg.textContent = 'Wrong user name or password.';
            button.disabled = false;
          }
        });
      }

      boot();
    </script>
  </body>
</html>
